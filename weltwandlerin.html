<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Die Weltenwandlerin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="song-page">
    <main class="game-shell song-shell">
      <header class="masthead">
        <p class="eyebrow">Eine Melodie aus fernen Sphären</p>
        <h1>Die Weltenwandlerin</h1>
        <p class="subtitle">Das Lied der Magierin</p>
      </header>

      <section class="parchment song-parchment" aria-labelledby="song-title">
        <div class="wax-seal" aria-hidden="true">☾</div>
        <div class="moon-mark" aria-hidden="true">☽ ✦ ☾</div>
        <p class="chapter">Höre, Wanderin</p>
        <h2 id="song-title">Die Weltenwandlerin</h2>
        <p class="song-intro">Eine Weise, gewoben aus Sternenstaub und alten Pfaden.</p>
        <div class="audio-altar">
          <span class="rune" aria-hidden="true">ᛟ</span>
          <audio controls preload="metadata">
            <source src="content/Die%20Weltenwandlerin.mp3" type="audio/mpeg" />
            Dein Browser unterstützt dieses Audioformat nicht.
          </audio>
          <span class="rune" aria-hidden="true">ᛟ</span>
        </div>
        <p class="song-note">Möge der Klang dich sicher durch die Schleier führen.</p>
      </section>
      <footer>✦ &nbsp; Zwischen den Welten liegt ein Lied &nbsp; ✦</footer>
    </main>
  </body>
</html>
